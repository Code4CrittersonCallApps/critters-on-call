<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A blind search of this market</title>
<style>
  @page { size: 13.333in 7.5in; margin: 0; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1f2a24;
    overflow: hidden;
    font-family: "Source Sans 3", "Source Sans Pro", sans-serif;
  }
  #stage {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #1f2a24;
    cursor: pointer;
  }
  #stage img {
    width: 100vw; height: 100vh;
    object-fit: contain;
    background: #F3EEE4;
    display: block;
  }
  .hud {
    position: fixed; right: 24px; bottom: 20px;
    color: #E8D48C; letter-spacing: 0.16em;
    font-size: 13px; font-weight: 700;
    text-transform: uppercase;
    opacity: 0.75;
    pointer-events: none;
    z-index: 2;
  }
  .print-page { display: none; }
  @media print {
    html, body { background: #F3EEE4; height: auto; overflow: visible; }
    #stage, .hud { display: none !important; }
    .print-page {
      display: block;
      width: 13.333in; height: 7.5in;
      page-break-after: always;
      margin: 0; padding: 0;
    }
    .print-page:last-child { page-break-after: auto; }
    .print-page img {
      width: 13.333in; height: 7.5in;
      display: block;
    }
  }
</style>
</head>
<body>
  <div id="stage"><img id="slide" alt="Demo slide"></div>
  <div class="hud" id="hud"></div>
  <div class="print-page"><img src="demo-slide-01-experiment.png?v=1121r" alt="Slide 1"></div>
  <div class="print-page"><img src="demo-slide-02-the-market.png?v=1121r" alt="Slide 2"></div>
  <div class="print-page"><img src="demo-slide-03-the-players.png?v=1121r" alt="Slide 3"></div>
  <div class="print-page"><img src="demo-slide-04-what-usually-wins.png?v=1121r" alt="Slide 4"></div>
  <div class="print-page"><img src="demo-slide-05-the-keywords.png?v=1121r" alt="Slide 5"></div>
  <div class="print-page"><img src="demo-slide-06-live-search.png?v=1121r" alt="Slide 6"></div>
  <div class="print-page"><img src="demo-slide-07-something-to-explain.png?v=1121r" alt="Slide 7"></div>
  <div class="print-page"><img src="demo-slide-08-young-farm.png?v=1121r" alt="Slide 8"></div>
  <div class="print-page"><img src="demo-slide-09-the-asks.png?v=1121r" alt="Slide 9"></div>
<script>
  const slides = [
    "demo-slide-01-experiment.png?v=1121r",
    "demo-slide-02-the-market.png?v=1121r",
    "demo-slide-03-the-players.png?v=1121r",
    "demo-slide-04-what-usually-wins.png?v=1121r",
    "demo-slide-05-the-keywords.png?v=1121r",
    "demo-slide-06-live-search.png?v=1121r",
    "demo-slide-07-something-to-explain.png?v=1121r",
    "demo-slide-08-young-farm.png?v=1121r",
    "demo-slide-09-the-asks.png?v=1121r"
  ];
  let i = 0;
  const img = document.getElementById("slide");
  const hud = document.getElementById("hud");
  function show(n) {
    i = (n + slides.length) % slides.length;
    img.src = slides[i];
    hud.textContent = (i + 1) + " / " + slides.length;
  }
  function next() { show(i + 1); }
  function prev() { show(i - 1); }
  document.getElementById("stage").addEventListener("click", next);
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown" || e.key === "Enter") {
      e.preventDefault(); next();
    } else if (e.key === "ArrowLeft" || e.key === "PageUp" || e.key === "Backspace") {
      e.preventDefault(); prev();
    } else if (e.key === "Home") {
      e.preventDefault(); show(0);
    } else if (e.key === "End") {
      e.preventDefault(); show(slides.length - 1);
    }
  });
  show(0);
</script>
</body>
</html>
