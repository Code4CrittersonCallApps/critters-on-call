<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dashboard · Crypto hub</title>
<style>
:root{--bg:#0b1220;--card:#121a2b;--line:#1e2a44;--text:#e8eefc;--muted:#93a0b8;--accent:#3dd68c;--gold:#fde68a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
a{color:#9ec1ff;text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 64px}
.crumb{font-size:.82rem;color:var(--muted);margin:0 0 10px}.crumb a{font-weight:600}
.kicker{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-size:1.7rem;margin:0 0 8px;letter-spacing:-.02em}
.card{background:var(--card);border:1px solid #c9a22788;border-radius:16px;padding:16px;margin:14px 0}
.card b{color:var(--gold)}
.card p{margin:8px 0 0;color:#c5d0e6;font-size:.92rem}
.note{color:var(--muted);font-size:.8rem}
</style></head>
<body><div class="wrap">
<p class="crumb"><a href="index.html">Crypto hub</a> → <a href="coins.html">Coins</a> → <b id="crumb">Asset</b></p>
<p class="kicker" id="kicker">Stub</p>
<h1 id="title">Asset</h1>
<p class="note" id="sub"></p>
<div class="card">
  <b>Dashboard not filled yet.</b>
  <p id="body">This page only names the asset. There is no chart, no position, and no price.</p>
</div>
<p class="note"><a href="index.html">Back to the hub</a> · <a href="coins.html">Coin list</a> · <a href="btc-factors.html">Bitcoin factors</a></p>
<script src="coins.js"></script>
<script>
function find(id){
  id = (id || "").toLowerCase();
  var coins = window.COINS || [];
  for (var i = 0; i < coins.length; i++) if (coins[i].id === id) return coins[i];
  var extra = window.EXTRA_STUBS || [];
  for (var j = 0; j < extra.length; j++) if (extra[j].id === id) return extra[j];
  return null;
}
var params = new URLSearchParams(location.search);
var asset = find(params.get("id"));
var title = document.getElementById("title");
var crumb = document.getElementById("crumb");
if (!asset){
  title.textContent = "Unknown asset";
  crumb.textContent = "Unknown";
  document.getElementById("sub").textContent = "That id is not on this hub.";
  document.title = "Unknown · Crypto hub";
} else {
  title.textContent = asset.name + " (" + asset.ticker + ")";
  crumb.textContent = asset.ticker;
  document.title = asset.ticker + " · Crypto hub";
  var line = asset.kind === "stock"
    ? "Strategy common stock. Dashboard not filled yet."
    : "Listed here as " + asset.name + ". Dashboard not filled yet.";
  if (asset.note) line = asset.note + " " + line;
  document.getElementById("sub").textContent = line;
}
</script>
</div></body></html>
