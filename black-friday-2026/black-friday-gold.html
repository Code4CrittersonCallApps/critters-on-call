<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critter Gold · Buy One, Gift One · $49.99 · Sheehan Homestead</title>
<meta name="description" content="Pay $49.99 once. Play all year. Buy One, Gift One, Nov 27–Dec 1. $100 in gifts, Gold web app, 40% off camps, zoos & trips.">
<link rel="icon" type="image/png" href="assets/gold-poster/coc.png">
<style>
@font-face{font-family:"Fraunces";src:url("assets/gold-poster/fraunces-normal-latin.woff2") format("woff2");font-weight:500 700;font-style:normal;font-display:swap}
@font-face{font-family:"Source Sans 3";src:url("assets/gold-poster/SourceSans3-Variable.ttf") format("truetype");font-weight:200 900;font-style:normal;font-display:swap}
@page{size:8.5in 11in;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#4e6558;--green-deep:#3A4F45;--gold:#c9a227;--gold-lt:#E8D48C;--cream:#F3EEE4;--ink:#1f2a24}
html,body{background:#d9d2c3;color:var(--ink);font-family:"Source Sans 3",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:8.5in;height:11in;overflow:hidden;display:flex;flex-direction:column;background:var(--cream);margin:0 auto}
@media print{html,body{background:var(--cream);width:8.5in;height:11in}.page{margin:0}}
.lg{display:inline-block;width:58px;height:58px;border-radius:50%;background-size:cover;background-position:center;flex:0 0 auto}
.lg-sh{background-image:url("assets/gold-poster/sh.png")}
.lg-coc{background-image:url("assets/gold-poster/coc.png");box-shadow:0 0 0 3px var(--gold)}
.brand{display:flex;align-items:stretch;background:var(--cream)}
.brand .side{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;padding:.18in 0 .14in}
.brand .side+.side{border-left:1px solid #e2dacb}
.brand .nm{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:16pt;line-height:1.1;color:var(--green)}
.rule{display:flex;height:6px}.rule .g{flex:1;background:var(--green)}.rule .y{flex:1;background:var(--gold)}

.body{flex:1;padding:.28in .58in .18in;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;min-height:0}
.hero{display:flex;width:100%;align-items:center;gap:.40in}
.hero .txt{flex:1.15}
.hero h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:36pt;line-height:1.05;color:var(--green)}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .card{flex:1;transform:rotate(-3deg);max-width:3.15in}
.hero .card img{width:100%;border-radius:16px;box-shadow:0 12px 28px rgba(0,0,0,.28);display:block}

.bogo{background:#1f2a24;color:var(--gold-lt);border:2.5px solid var(--gold);border-radius:18px;padding:14px 28px;text-align:center;width:100%}
.bogo strong{display:block;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:26pt;letter-spacing:.04em;line-height:1.05;color:var(--gold-lt)}
.bogo span{display:block;font-size:12.5pt;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#fff;margin-top:4px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.18in;width:100%}
.tile{background:#fff;border:1.5px solid #e2dacb;border-top:6px solid var(--gold);border-radius:16px;padding:18px 10px 16px;text-align:center;min-height:2.15in;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.tile svg.ic{width:42px;height:42px;margin-bottom:10px;stroke:var(--green);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile h2{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:16.5pt;line-height:1.15;color:var(--green)}
.gp{margin-top:11px;display:inline-flex;align-items:center;gap:8px;background:#000;color:#fff;border-radius:6px;padding:5px 10px 5px 8px;text-decoration:none}
.gp .tri{width:18px;height:20px;flex:0 0 auto;display:block}
.gp .copy{text-align:left;line-height:1.05}
.gp .copy em{display:block;font-style:normal;font-size:6.2pt;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.gp .copy b{display:block;font-size:10.5pt;font-weight:700;letter-spacing:.01em;font-family:Arial,Helvetica,sans-serif}

.price{text-align:center;padding:6px 0 2px}
.price .yl{display:block;font-size:11pt;font-weight:800;letter-spacing:.20em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.price .yp{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:58pt;line-height:.9;color:var(--green)}

.ft{background:var(--green);color:var(--cream);border-top:5px solid var(--gold);padding:.13in .58in;display:flex;align-items:center;gap:.28in}
.ft .qr{background:#fff;border-radius:10px;padding:6px;flex:0 0 auto}
.ft .qr img{width:92px;height:92px;display:block}
.ft .mid{flex:1}
.ft .mid b{display:block;font-family:Fraunces,Georgia,serif;font-size:18pt;color:var(--gold-lt);margin-bottom:2px}
.ft .mid a{color:var(--cream);font-size:10pt}
.ft .ph{font-family:Fraunces,Georgia,serif;font-size:26pt;font-weight:700;color:var(--gold-lt);white-space:nowrap;line-height:1;text-align:right}
.ft .ph a{color:var(--gold-lt);text-decoration:none}
.gbadge{display:inline-flex;align-items:center;gap:6px;margin-top:7px;background:rgba(255,255,255,.96);color:#1f2a24;border-radius:20px;padding:4px 11px 4px 8px;font-size:9.5pt;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.gbadge .gicon{width:14px;height:14px;flex:0 0 auto;display:block}
.gbadge .gstars{color:#d49d17;letter-spacing:.4px;font-size:10.5pt;line-height:1}

@media screen and (max-width:860px){
  html,body{background:var(--cream)}
  .page{width:100%;height:auto;margin:0}
  .hero,.ft,.tiles{flex-direction:column}
  .tiles{grid-template-columns:1fr 1fr}
  .hero h1{font-size:36pt}
  .hero .card{transform:none;max-width:320px;margin:0 auto}
  .body{padding:.24in .2in}
  .ft{padding:.2in;flex-wrap:wrap}
  .ft .ph{text-align:left}
}
</style>
</head>
<body>
<section class="page">
  <header class="brand">
    <div class="side"><span class="lg lg-sh" role="img" aria-label="Sheehan Homestead"></span><div class="nm">Sheehan<br>Homestead</div></div>
    <div class="side"><span class="lg lg-coc" role="img" aria-label="Critters on Call"></span><div class="nm">Critters<br>on Call</div></div>
  </header>
  <div class="rule"><span class="g"></span><span class="y"></span></div>

  <div class="body">
    <div class="hero">
      <div class="txt">
        <h1><span style="white-space:nowrap">Pay $49.99 once.</span><br><em style="white-space:nowrap">Play all year.</em></h1>
      </div>
      <div class="card"><img src="assets/gold-poster/card.jpg" alt="The Critter Gold member card: In Critters We Trust"></div>
    </div>

    <div class="bogo">
      <strong>BUY ONE, GIFT ONE</strong>
      <span>Nov 27 – Dec 1</span>
    </div>

    <div class="tiles">
      <div class="tile">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v14M5 11h14"/><path d="M20 7h-5.2A2.8 2.8 0 0 0 12 5.2 2.8 2.8 0 0 0 9.2 7H4v14h16V7Z"/></svg>
        <h2>$100 in gifts</h2>
      </div>
      <div class="tile">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 19h2"/></svg>
        <h2>Gold web app</h2>
        <div class="gp" aria-label="Coming soon on Google Play">
          <svg class="tri" viewBox="0 0 18 20" aria-hidden="true">
            <path fill="#EA4335" d="M.7 1.1 10.2 10 .7 18.9A1.6 1.6 0 0 1 0 17.6V2.4C0 1.6.3 1.2.7 1.1Z"/>
            <path fill="#FBBC04" d="M13.2 7.1 10.2 10l3 2.9 3.9-2.2c.8-.5.8-1.3 0-1.8L13.2 7.1Z"/>
            <path fill="#4285F4" d="M.7 18.9 10.2 10l3 2.9-12.5 7.2c-.5.3-1 0-1-.6v-.6Z"/>
            <path fill="#34A853" d="M13.2 12.9 10.2 10 .7 1.1c.10.20.0.5 1-.2L13.2 7.1 17.1 9.3c.8.5.8 1.3 0 1.8l-3.9 1.8Z"/>
          </svg>
          <span class="copy"><em>Coming soon</em><b>Google Play</b></span>
        </div>
      </div>
      <div class="tile">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 8.5h-4.2a2 2 0 0 0 0 4H13a2 2 0 0 1 0 4H8.5M12 6.5V8.5m0 8V17.5"/></svg>
        <h2>40% off camps,<br>zoos &amp; trips</h2>
      </div>
      <div class="tile">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="16.5" cy="8.5" r="2.4"/><path d="M3.5 19c.4-3.2 2.6-5 5.5-5s5.1 1.8 5.5 5"/><path d="M14 14.2c2.2-.2 3.9 1.1 4.5 3.8"/></svg>
        <h2>Join 500+ members</h2>
      </div>
    </div>

    <div class="price">
      <span class="yl">Your price</span>
      <div class="yp">$49.99</div>
    </div>
  </div>

  <footer class="ft">
    <a class="qr" href="https://code4crittersoncallapps.github.io/gold/" target="_blank" rel="noopener"><img src="assets/gold-poster/qr-gold.png" alt="QR code to the Gold web app"></a>
    <div style="flex:1"></div>
    <div style="text-align:right">
      <div class="ph"><a href="tel:9142631311">914-263-1311</a></div>
      <div class="gbadge">
        <svg class="gicon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/>
          <path fill="#FBBC05" d="M5.27 14.29c-.24-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/>
        </svg>
        <span class="gstars" aria-label="5 out of 5 stars">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
        <span>100+ five-star reviews</span>
      </div>
    </div>
  </footer>
</section>
</body>
</html>
